# Installed by deploy/install.sh as
# /etc/systemd/journald.conf.d/multieffect.conf.
#
# Raspberry Pi OS keeps the journal in RAM only (no /var/log/journal), so
# everything logged before a crash or a power loss is gone after the reboot
# -- exactly the logs needed to find out why it happened. Persistent, with a
# cap so an SD card never fills up with logs.
[Journal]
Storage=persistent
SystemMaxUse=200M
# Batch writes to the SD card; anything at warning level or above is still
# written at once.
SyncIntervalSec=30s
